name: scout-texts

# TEMPORARY: downloads candidate texts listed in corpus/scripture/scout/urls.txt
# and commits them to this branch so they can be read offline. Removed before merge.

on:
  push:
    branches: [claude/biblical-sin-teaching-vaqiri]
    paths: ["corpus/scripture/scout/urls.txt"]

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p corpus/scripture/scout/out
          while read -r name url; do
            [ -z "$name" ] && continue
            code=$(curl -sL --retry 3 -A "Mozilla/5.0 NotAlone-corpus" -o "corpus/scripture/scout/out/$name.txt" -w '%{http_code}' "$url" || echo fail)
            echo "$name $code $(wc -c < corpus/scripture/scout/out/$name.txt 2>/dev/null)" | tee -a corpus/scripture/scout/out/_status.txt
          done < corpus/scripture/scout/urls.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corpus/scripture/scout/out
          git commit -m "scout: fetched texts" && git push
