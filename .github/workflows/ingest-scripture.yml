name: ingest-scripture

# Embeds the scripture corpus into the not-alone-scripture Supabase project.
#
# Resumable by design: the ingest script skips every chunk the database already
# holds in current form, commits after each batch, and stops cleanly before the
# 6-hour Actions limit. If work remains, this workflow dispatches itself again;
# the schedule is a backstop in case a chained run never starts.
#
# When nothing remains it opens (once) the issue "Scripture ingestion complete",
# which is the phone notification. Failures open/update "Scripture ingestion failed".
#
# Lives on the default branch because workflow_dispatch and schedule only run
# from there; it checks out the pivot branch, where the code is.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch holding the scripture code
        default: pivot/scripture
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: ingest-scripture
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SCRIPTURE_SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SCRIPTURE_SUPABASE_SERVICE_ROLE_KEY }}
  VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GENERATION_PROVIDER: gemini
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DONE_TITLE: "Scripture ingestion complete"
  FAIL_TITLE: "Scripture ingestion failed"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Skip if already complete
        id: gate
        run: |
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state all --search "\"$DONE_TITLE\" in:title" --json number --jq length)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$n" -gt 0 ]; then
            echo "Already complete; scheduled run exits."; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          ref: ${{ inputs.ref || 'pivot/scripture' }}
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 20
          cache: npm
      - if: steps.gate.outputs.skip != 'true'
        run: npm ci
      - name: Fetch corpus (idempotent)
        if: steps.gate.outputs.skip != 'true'
        run: npm run scripture:fetch
      - name: Build chunks (no network)
        if: steps.gate.outputs.skip != 'true'
        run: npm run scripture:dry
      - name: Ingest
        id: ingest
        if: steps.gate.outputs.skip != 'true'
        run: npm run scripture:ingest -- --max-minutes 320
      - name: Continue in a new run
        if: steps.gate.outputs.skip != 'true' && steps.ingest.outputs.remaining != '0' && steps.ingest.outputs.embedded != '0'
        run: |
          echo "${{ steps.ingest.outputs.remaining }} chunks remain; dispatching another run."
          gh workflow run ingest-scripture.yml -R "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
      - name: Announce completion
        if: steps.gate.outputs.skip != 'true' && steps.ingest.outputs.remaining == '0'
        run: |
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state all --search "\"$DONE_TITLE\" in:title" --json number --jq length)
          if [ "$n" -eq 0 ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "$DONE_TITLE — ${{ steps.ingest.outputs.done }} chunks" \
              --body "All scripture chunks are embedded in not-alone-scripture. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
      - name: Report failure
        if: failure()
        run: |
          body="Ingestion run failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID — progress is saved; the next run resumes."
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$FAIL_TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "$body"
          else gh issue create -R "$GITHUB_REPOSITORY" --title "$FAIL_TITLE" --body "$body"; fi
