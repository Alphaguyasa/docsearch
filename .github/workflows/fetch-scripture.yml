name: fetch-scripture

# Downloads the public-domain corpus listed in corpus/scripture/sources.json and
# commits the resulting manifest (hashes, sizes, resolved archive.org ids) back
# to the branch. Raw texts are NOT committed; they are uploaded as an artifact
# and re-fetched byte-identically by the ingestion workflow.
#
# Triggered by push to main (the trunk since PR #7). The commit-back touches only
# manifest.json / failed.json, which are outside the path filter, so it cannot
# re-trigger itself.
#
# A GITHUB_TOKEN push never triggers other workflows, so the manifest commit
# alone never started ingest-scripture: new sources sat fetched but unembedded
# (2026-10-21). After a clean fetch that changed the manifest, this dispatches
# ingest itself, which also carries canon.json tag edits to the database.

on:
  push:
    branches: [main]
    paths:
      - "corpus/scripture/sources.json"
      - "scripts/fetch-scripture.ts"
      - "src/lib/scripture/**"
      - "scripts/scripture-dry.ts"
      - "data/**"
      - ".github/workflows/fetch-scripture.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # dispatch ingest-scripture

concurrency:
  group: fetch-scripture
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch corpus
        id: fetch
        continue-on-error: true
        run: npm run scripture:fetch
      - name: Parse and chunk (no network)
        id: dry
        if: always()
        continue-on-error: true
        run: npm run scripture:dry
      - name: Upload chunks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scripture-chunks
          path: corpus/scripture/chunks/
          retention-days: 7
          if-no-files-found: warn
      - name: Upload raw corpus
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scripture-raw
          path: corpus/scripture/raw/
          retention-days: 7
          if-no-files-found: warn
      - name: Commit manifest
        id: commit
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # These files are regenerated whole by this run, so this run's copy wins.
          # Re-apply them on the latest tip each attempt instead of rebasing: two
          # fetch runs queued minutes apart conflicted in manifest.json and
          # report.md under `git pull --rebase` (2026-10-22).
          FILES="corpus/scripture/manifest.json corpus/scripture/failed.json corpus/scripture/report.md"
          [ -f corpus/scripture/chunks-report.md ] && FILES="$FILES corpus/scripture/chunks-report.md"
          mkdir -p /tmp/fetched
          for f in $FILES; do cp "$f" /tmp/fetched/; done
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            for f in $FILES; do cp "/tmp/fetched/$(basename "$f")" "$f"; done
            git add $FILES
            if git diff --cached --quiet; then echo "manifest unchanged"; exit 0; fi
            git commit -q -m "chore(corpus): update scripture manifest [fetch-scripture]"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              echo "pushed=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected (attempt $attempt), retrying on the new tip"
            sleep $((attempt * 5))
          done
          echo "::error title=manifest not pushed::could not push the manifest after 5 attempts"
          exit 1
      - name: Start ingest
        # Only after a clean fetch and chunking: a partial corpus is not worth
        # embedding, and the next clean run will dispatch it.
        if: always() && steps.commit.outputs.pushed == '1' && steps.fetch.outcome == 'success' && steps.dry.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ingest-scripture.yml --ref "$GITHUB_REF_NAME"
      - name: Fail if fetch or chunking failed
        if: steps.fetch.outcome == 'failure' || steps.dry.outcome == 'failure'
        run: |
          cat corpus/scripture/failed.json
          exit 1
