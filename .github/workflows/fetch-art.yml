name: fetch-art

# Downloads the artwork listed in scripts/art/sources.json from Wikimedia
# Commons (licence-checked), converts it to phone-sized WebP, and commits
# public/art/ back to the branch. Push-triggered because workflow_dispatch only
# works for workflows on the default branch. The commit-back touches only
# public/art/, outside the path filter, so it cannot re-trigger itself.

on:
  push:
    paths:
      - "scripts/art/sources.json"
      - "scripts/fetch-art.ts"
      - "scripts/og-images.ts"
      - ".github/workflows/fetch-art.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-art-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save sharp
      - run: npx tsx scripts/fetch-art.ts
      - run: npx tsx scripts/og-images.ts
      - name: Commit artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/art
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "chore(art): fetch artwork [fetch-art]"
          git push
