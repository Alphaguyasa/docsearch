name: ci

# The gate every PR must pass before merging (see CLAUDE.md, merge policy).
# No real keys: the build gets dummy values, and nothing here calls Supabase,
# Voyage, Gemini or Anthropic. Quality evals that do need keys live in
# scripture-eval.yml.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_URL: https://ci-dummy.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: ci-dummy
  VOYAGE_API_KEY: ci-dummy
  GENERATION_PROVIDER: gemini
  GEMINI_API_KEY: ci-dummy
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Eval harness unit tests
        run: npx vitest run
      - name: Build
        run: npm run build
